model_list:
  # --- text / vision (all via OpenRouter) ---
  - model_name: "gpt-oss-20b"
    litellm_params:
      model: "openrouter/openai/gpt-oss-20b"
      api_key: "os.environ/OPENROUTER_API_KEY"
    model_info:
      mode: "chat"
      supports_vision: false
      supports_function_calling: true
  - model_name: "gpt-oss-120b"
    litellm_params:
      model: "openrouter/openai/gpt-oss-120b"
      api_key: "os.environ/OPENROUTER_API_KEY"
    model_info:
      mode: "chat"
      supports_vision: false
      supports_function_calling: true
  - model_name: "gemini-3.1-flash-lite"
    litellm_params:
      model: "openrouter/google/gemini-3.1-flash-lite"
      api_key: "os.environ/OPENROUTER_API_KEY"
    model_info:
      mode: "chat"
      supports_vision: true
      supports_function_calling: true
  - model_name: "gemini-3.5-flash"
    litellm_params:
      model: "openrouter/google/gemini-3.5-flash"
      api_key: "os.environ/OPENROUTER_API_KEY"
    model_info:
      mode: "chat"
      supports_vision: true
      supports_function_calling: true
  - model_name: "kimi-k2.6"
    litellm_params:
      model: "openrouter/moonshotai/kimi-k2.6"
      api_key: "os.environ/OPENROUTER_API_KEY"
    model_info:
      mode: "chat"
      supports_vision: true
      supports_function_calling: true

  # --- text (via IO Intelligence by io.net) ---
  # OpenAI-compatible endpoint: https://api.intelligence.io.solutions/api/v1
  - model_name: "glm-5.3"
    litellm_params:
      model: "openai/zai-org/GLM-5.3"
      api_key: "os.environ/IONET_API_KEY"
      api_base: "https://api.intelligence.io.solutions/api/v1"
    model_info:
      mode: "chat"
      supports_vision: false
      supports_function_calling: true
  - model_name: "deepseek-r1"
    litellm_params:
      model: "openai/deepseek-ai/DeepSeek-R1-0528"
      api_key: "os.environ/IONET_API_KEY"
      api_base: "https://api.intelligence.io.solutions/api/v1"
    model_info:
      mode: "chat"
      supports_vision: false
      supports_function_calling: true
  - model_name: "llama-3.3-70b"
    litellm_params:
      model: "openai/meta-llama/Llama-3.3-70B-Instruct"
      api_key: "os.environ/IONET_API_KEY"
      api_base: "https://api.intelligence.io.solutions/api/v1"
    model_info:
      mode: "chat"
      supports_vision: false
      supports_function_calling: true

  # --- image generation (OpenRouter: Gemini 3.1 Flash Image / "Nano Banana") ---
  - model_name: "gemini-3.1-flash-image"
    litellm_params:
      model: "openrouter/google/gemini-3.1-flash-image-preview"
      api_key: "os.environ/OPENROUTER_API_KEY"
    model_info:
      mode: "image_generation"

  # --- image editing (same Nano Banana model, edit mode) ---
  - model_name: "gemini-3.1-flash-image-edit"
    litellm_params:
      model: "openrouter/google/gemini-3.1-flash-image-preview"
      api_key: "os.environ/OPENROUTER_API_KEY"
    model_info:
      mode: "image_edit"

  # --- embedding (for conversation search) ---
  - model_name: "text-embedding-3-small"
    litellm_params:
      model: "openrouter/openai/text-embedding-3-small"
      api_key: "os.environ/OPENROUTER_API_KEY"
    model_info:
      mode: "embedding"

  # --- audio transcription ---
  - model_name: "whisper-v3-turbo"
    litellm_params:
      model: "fireworks_ai/whisper-v3-turbo"
      api_key: "os.environ/FIREWORK_KEY"
      # Fireworks' low-latency "direct" transcription host; litellm appends /v1/audio/transcriptions.
      api_base: "https://audio-turbo.us-virginia-1.direct.fireworks.ai"
    model_info:
      mode: "audio_transcription"

general_settings:
  drop_params: true

litellm_settings:
  drop_params: true
