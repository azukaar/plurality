name: Android Build

on:
  push:
    branches: [ master ]
    paths:
      - 'client/**'
      - '.github/workflows/android-build.yml'

jobs:
  build-android:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    outputs:
      signing: ${{ steps.signing-check.outputs.signing }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: 'stable'

      - name: Check signing secrets
        id: signing-check
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          SIGNING=1
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::warning::Android release signing secrets are not configured. Building with debug signing keys (suitable for sideloading; not for Play Store distribution)."
            SIGNING=0
          fi
          echo "signing=$SIGNING" >> "$GITHUB_OUTPUT"

      - name: Verify signing secrets are set
        if: steps.signing-check.outputs.signing == '1'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          missing=0
          for v in KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD:STORE_PASSWORD ANDROID_KEY_PASSWORD:KEY_PASSWORD ANDROID_KEY_ALIAS:KEY_ALIAS; do
            name="${v%%:*}"; var="${v##*:}"
            if [ -z "${!var}" ]; then echo "::error::Missing secret: ${name/KEYSTORE_BASE64/ANDROID_KEYSTORE_BASE64}"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Set the required Android signing secrets in repo Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "All Android signing secrets are present."

      - name: Decode keystore
        if: steps.signing-check.outputs.signing == '1'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > client/android/app/upload-keystore.jks
          SIZE=$(stat -c%s client/android/app/upload-keystore.jks)
          echo "Decoded keystore: ${SIZE} bytes"
          if keytool -list \
              -keystore client/android/app/upload-keystore.jks \
              -storepass "$STORE_PASSWORD" \
              -alias "$KEY_ALIAS" >/dev/null 2>keytool.err; then
            echo "Keystore decoded and opened successfully."
          else
            echo "::error::keytool could not open the keystore with the configured alias/password (alias=$KEY_ALIAS, size=$SIZE bytes). If the size looks wrong the ANDROID_KEYSTORE_BASE64 secret is likely truncated or corrupt."
            cat keytool.err
            exit 1
          fi

      - name: Create key.properties
        if: steps.signing-check.outputs.signing == '1'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > client/android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build Android APK
        run: |
          cd client
          flutter pub get
          flutter build apk --release

      - name: Collect APK
        run: |
          mkdir -p downloads/android
          cp client/build/app/outputs/flutter-apk/app-release.apk \
            downloads/android/plurality-android-latest.apk

      - name: Read app version
        id: appversion
        run: |
          VERSION=$(grep '^version:' client/pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.appversion.outputs.version }}
          name: v${{ steps.appversion.outputs.version }}
          fail_on_unmatched_files: false
          files: downloads/android/plurality-android-latest.apk